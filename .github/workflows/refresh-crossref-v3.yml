name: Refresh Crossref dataset v4

on:
  workflow_dispatch:
  push:
    branches: [data-refresh-2026-09-12]
    paths:
      - 'scraping_computing_reseaches_of_bohol_island_state_university.py'
      - '.github/workflows/refresh-crossref-v3.yml'

concurrency:
  group: bisu-crossref-refresh-data-refresh-2026-09-12
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out refresh branch
        uses: actions/checkout@v4
        with:
          ref: data-refresh-2026-09-12
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests matplotlib wordcloud

      - name: Harvest BISU computing records
        shell: bash
        run: |
          set -o pipefail
          python scraping_computing_reseaches_of_bohol_island_state_university.py | tee refresh_scrape_v4.log

      - name: Validate refreshed CSV
        run: |
          python - <<'PY'
          import csv
          from collections import Counter

          with open('bisu_computing_crossref_results.csv', encoding='utf-8-sig') as f:
              rows = list(csv.DictReader(f))
          if not rows:
              raise SystemExit('Refreshed CSV is empty')

          dois = [r.get('DOI','').strip().lower() for r in rows if r.get('DOI','').strip()]
          if len(dois) != len(set(dois)):
              raise SystemExit('Duplicate DOI values remain')

          known = {
              '10.1007/978-3-032-18846-5_8',
              '10.1007/978-3-032-23515-2_12',
              '10.1007/978-3-032-23515-2_14',
              '10.1007/978-3-032-23716-3_8',
              '10.1007/978-3-032-23716-3_9',
              '10.1007/978-3-032-25187-9_14',
              '10.1007/978-3-032-25187-9_45',
              '10.1007/978-3-032-25187-9_46',
          }
          missing = sorted(known - set(dois))
          if missing:
              raise SystemExit('Known Springer DOI regression: ' + ', '.join(missing))

          print('VALIDATED_ROWS', len(rows))
          print('BILAR_ROWS', sum(r.get('CampusMatched') == 'Bilar Campus' for r in rows))
          print('SPRINGER_ROWS', sum('springer' in (r.get('Publisher') or '').lower() for r in rows))
          print('BOOK_CHAPTERS', sum(r.get('Type') == 'book-chapter' for r in rows))
          print('MANUAL_REVIEW', sum(r.get('NeedsManualReview') == 'YES' for r in rows))
          print('YEAR_COUNTS', dict(Counter(r.get('Year') for r in rows)))
          PY

      - name: Regenerate figures
        run: python analyze_bisu_research.py | tee refresh_analysis_v4.log

      - name: Write refresh audit
        run: |
          python - <<'PY'
          import csv
          from collections import Counter
          from datetime import datetime, timezone

          with open('bisu_computing_crossref_results.csv', encoding='utf-8-sig') as f:
              rows = list(csv.DictReader(f))

          year = Counter(r['Year'] for r in rows)
          campus = Counter(r['CampusMatched'] for r in rows)
          program = Counter(r['ProgramInferred'] for r in rows)
          typ = Counter(r['Type'] for r in rows)
          publisher = Counter(r['Publisher'] for r in rows)
          discovery = Counter(
              'author/DOI recovery' if ('author:' in (r.get('DiscoveryMethod') or '') or 'known-doi:' in (r.get('DiscoveryMethod') or ''))
              else 'affiliation discovery'
              for r in rows
          )
          def fmt(c):
              return '\n'.join(f'- {k or "(blank)"}: {v}' for k, v in c.most_common())

          now = datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M UTC')
          springer = sum('springer' in (r.get('Publisher') or '').lower() for r in rows)
          bilar = sum(r.get('CampusMatched') == 'Bilar Campus' for r in rows)
          review = sum(r.get('NeedsManualReview') == 'YES' for r in rows)

          text = f'''# Crossref Data Refresh Audit — September 2026\n\nRetrieval completed: **{now}**\n\nValidated BISU computing records: **{len(rows)}**\n\nBilar Campus records: **{bilar}**\n\nSpringer/Springer Nature records: **{springer}**\n\nAuthor-evidence records flagged for manual review: **{review}**\n\n## Discovery method\n{fmt(discovery)}\n\n## Method\nThe harvester now combines relevance-ranked Crossref affiliation queries with author expansion from verified BISU computing authors and direct DOI regression checks for verified BISU works that Crossref affiliation-only searches previously missed. Author-only inclusions require a trusted BISU author match plus a computing-domain signal and are explicitly flagged when manual review is still advisable.\n\n## By year\n{fmt(year)}\n\n## By campus\n{fmt(campus)}\n\n## By inferred program\n{fmt(program)}\n\n## By document type\n{fmt(typ)}\n\n## Top publishers\n{fmt(Counter(dict(publisher.most_common(10))))}\n\nAll 13 figures in `charts/` were regenerated from this refreshed CSV.\n'''
          open('DATA_REFRESH_2026-09-12.md', 'w', encoding='utf-8').write(text)
          PY

      - name: Commit refreshed dataset and figures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bisu_computing_crossref_results.csv charts DATA_REFRESH_2026-09-12.md
          if git diff --cached --quiet; then
            echo 'No data/figure changes detected.'
          else
            git commit -m 'Refresh BISU dataset with author-expanded Springer recovery [skip ci]'
            git push origin HEAD:data-refresh-2026-09-12
          fi

      - name: Package refreshed outputs
        run: |
          mkdir -p refresh-package
          cp bisu_computing_crossref_results.csv DATA_REFRESH_2026-09-12.md refresh-package/
          cp refresh_scrape_v4.log refresh_analysis_v4.log refresh-package/
          cp -R charts refresh-package/

      - name: Upload refresh package
        uses: actions/upload-artifact@v4
        with:
          name: BISU-bibliometric-refresh-v4-2026-09-12
          path: refresh-package/
          retention-days: 30
